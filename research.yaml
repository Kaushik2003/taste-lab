watch_sites:
  - transformer-circuits.pub
  - anthropic.com/research
  - research.google/blog
  - alignmentforum.org
  - jyopari.github.io      # SEAL authors

# Plain-text queries for scripts/fetch_semantic_scholar.py (backfill + adjacent areas).
# Semantic Scholar has no ti:/abs: syntax; these match title+abstract.
s2_queries:
  foundations_backfill:
    - 'metamemory metacognition monitoring control framework'
    - 'feeling of knowing judgment of learning confidence'
    - 'intrinsic motivation curiosity reinforcement learning exploration'
    - 'world models reinforcement learning latent dynamics'
    - 'active inference free energy principle action perception'
    - 'open-ended evolution novelty search'
    - 'interestingness compression progress artificial curiosity'
  adjacent_recent:
    - 'world model language model reasoning planning'
    - 'self-model neural network representation'
    - 'intrinsic motivation large language model agents'
    - 'aesthetic judgment machine taste preference model'
    - 'continual self-improvement language model'
