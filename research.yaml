# Watchlist for scripts/fetch_arxiv.py and /scout
# Edit freely. Queries use arXiv API syntax (ti: title, abs: abstract, au: author).

categories: [cs.LG, cs.CL, cs.AI, q-bio.NC, cs.NE]

queries:
  metacognition:
    - 'abs:"metacognition" AND abs:"language model"'
    - 'abs:introspection AND abs:"language model"'
    - 'abs:"self-knowledge" AND abs:"language model"'
    - 'abs:"metacognitive control"'
    - 'abs:"confidence" AND abs:"self-monitoring"'
    - 'abs:"feeling of knowing" OR abs:"metamemory"'
    - 'abs:"self-model" AND abs:"neural network"'
  self_modification:
    - 'abs:"self-adapting" OR abs:"self-edit"'
    - 'abs:"weight-space" AND abs:edit'
    - 'abs:"self-referential" AND abs:weight'
    - 'abs:"test-time training" AND abs:"language model"'
    - 'abs:"continual learning" AND abs:"self-improv*"'
  valence_and_preference:
    - 'abs:"emotion" AND abs:"steering" AND abs:"language model"'
    - 'abs:"emergent values" OR abs:"utility engineering"'
    - 'abs:"persona vector*" OR abs:"representation engineering"'
  taste_and_intrinsic_reward:
    - 'abs:"intrinsic reward" AND abs:"language model"'
    - 'abs:"self-rewarding" OR abs:"internal feedback"'
    - 'abs:taste AND (abs:"AI" OR abs:"language model")'
    - 'abs:interestingness OR abs:"open-endedness"'
  collapse_and_limits:
    - 'abs:"model collapse"'
    - 'abs:"unsupervised RLVR" OR abs:"entropy collapse"'
  neuromodulation:
    - 'abs:neuromodulation AND (abs:"reinforcement learning" OR abs:"neural network")'
  code_quality:
    - '(abs:"code readability" OR abs:"code quality") AND abs:"language model"'

  world_models:
    - 'abs:"world model" AND (abs:"reinforcement learning" OR abs:"language model")'
    - 'abs:"latent dynamics" OR abs:"learned simulator"'
  intrinsic_motivation:
    - 'abs:"curiosity-driven" OR (abs:curiosity AND abs:"intrinsic reward")'
    - 'abs:empowerment AND abs:"reinforcement learning"'
    - 'abs:"active inference" OR abs:"free energy principle"'
  open_endedness:
    - 'abs:"open-endedness" OR abs:"open-ended learning"'
    - 'abs:"novelty search" OR abs:"quality-diversity"'

